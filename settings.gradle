pluginManagement {
    plugins {
        id "io.freefair.lombok" version "8.4"
        id 'org.springframework.boot' version '3.4.5'
        id 'io.spring.dependency-management' version '1.1.7'
    }

    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'celestica-shop'

include 'admin-back-module',
        'client-back-module'
include 'common-back-module'

